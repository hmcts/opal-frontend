<div class="govuk-grid-column-full">
  <h1 class="govuk-heading-l">Are you sure you want to remove this alternate payment reference?</h1>
  <app-fines-acc-apr-manage-table [references]="references()" tableId="apr-remove-table" [showActions]="false" />
  <form (submit)="handleRemove($event)" [attr.aria-busy]="isRemoving()">
    <div class="govuk-button-group">
      <button
        class="govuk-button govuk-button--warning govuk-!-margin-right-4"
        id="apr-remove-confirm"
        type="submit"
        [disabled]="isRemoving()"
      >
        Yes - remove reference
      </button>
      <opal-lib-govuk-cancel-link
        id="apr-remove-cancel"
        cancelLinkText="No - cancel"
        (linkClickEvent)="handleCancel()"
      ></opal-lib-govuk-cancel-link>
    </div>
  </form>
</div>
