<div class="govuk-grid-column-full">
  <opal-lib-govuk-heading-with-caption
    [captionText]="accountCaption()"
    headingText="Are you sure you want to remove this alternate payment reference"
    headingClasses="govuk-heading-l"
  />
  <app-fines-acc-apr-manage-table [references]="references()" tableId="apr-remove-table" [showActions]="false" />
  <form (submit)="handleRemove($event)" [attr.aria-busy]="isRemoving()">
    <div class="govuk-button-group">
      <button
        class="govuk-button govuk-!-margin-right-4"
        id="apr-remove-confirm"
        type="submit"
        [disabled]="isRemoving()"
      >
        Yes - remove reference
      </button>
      <opal-lib-govuk-cancel-link id="apr-remove-cancel" (linkClickEvent)="handleCancel()"></opal-lib-govuk-cancel-link>
    </div>
  </form>
</div>
