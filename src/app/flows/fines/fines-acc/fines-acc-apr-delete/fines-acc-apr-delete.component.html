<div class="govuk-grid-column-full">
  <opal-lib-govuk-heading-with-caption
    [captionText]="accountCaption()"
    headingText="Are you sure you want to remove this alternate payment reference"
    headingClasses="govuk-heading-l"
  />
  <app-fines-acc-apr-list-table [references]="references()" tableId="apr-remove-table" [showActions]="false" />
  <fieldset class="govuk-fieldset" [disabled]="isRemoving()" [attr.aria-busy]="isRemoving()">
    <legend class="govuk-visually-hidden">Confirm reference removal</legend>
    <div class="govuk-button-group">
      <opal-lib-govuk-button buttonId="apr-remove-confirm" type="button" (buttonClickEvent)="handleRemove()">
        Yes - remove reference
      </opal-lib-govuk-button>
      <opal-lib-govuk-cancel-link
        id="apr-remove-cancel"
        cancelLinkText="No - cancel"
        (linkClickEvent)="handleCancel()"
      />
    </div>
  </fieldset>
</div>
