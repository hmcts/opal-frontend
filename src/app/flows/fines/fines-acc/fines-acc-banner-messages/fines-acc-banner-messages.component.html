@if (hasVersionMismatch) {
  <div class="govuk-grid-column-full" id="{{ id }}-warning">
    <opal-lib-moj-alert type="warning" ariaLabel="Some information on this page may be out of date">
      <opal-lib-moj-alert-icon icon type="warning"></opal-lib-moj-alert-icon>
      <opal-lib-moj-alert-content content>
        <opal-lib-moj-alert-content-text
          >Some information on this page may be out of date.
          <a tabindex="0" (click)="handleRefreshPage()" (keyup.enter)="handleRefreshPage()"
            >Refresh</a
          ></opal-lib-moj-alert-content-text
        >
      </opal-lib-moj-alert-content>
    </opal-lib-moj-alert>
  </div>
}
@if (successMessage) {
  <div class="govuk-grid-column-full" id="{{ id }}-success">
    <opal-lib-moj-alert
      type="success"
      [ariaLabel]="successMessage"
      [showDismiss]="true"
      (dismissed)="handleClearSuccessMessage()"
    >
      <opal-lib-moj-alert-icon icon type="success"></opal-lib-moj-alert-icon>
      <opal-lib-moj-alert-content content>
        <opal-lib-moj-alert-content-text>{{ successMessage }}</opal-lib-moj-alert-content-text>
      </opal-lib-moj-alert-content>
    </opal-lib-moj-alert>
  </div>
}
@if (collectionOrderMessage) {
  <div class="govuk-grid-column-full" id="{{ id }}-collection-order">
    <opal-lib-moj-alert type="error" [ariaLabel]="collectionOrderMessage">
      <opal-lib-moj-alert-icon icon type="error"></opal-lib-moj-alert-icon>
      <opal-lib-moj-alert-content content>
        <opal-lib-moj-alert-content-text>{{ collectionOrderMessage }}</opal-lib-moj-alert-content-text>
      </opal-lib-moj-alert-content>
    </opal-lib-moj-alert>
  </div>
}
@if (hasPaymentHold) {
  <div class="govuk-grid-column-full" id="{{ id }}-payment-hold">
    <opal-lib-moj-alert type="warning" ariaLabel="Payments to this creditor are on hold.">
      <opal-lib-moj-alert-icon icon type="warning"></opal-lib-moj-alert-icon>
      <opal-lib-moj-alert-content content>
        <opal-lib-moj-alert-content-text>Payments to this creditor are on hold. </opal-lib-moj-alert-content-text>
      </opal-lib-moj-alert-content>
    </opal-lib-moj-alert>
  </div>
}
