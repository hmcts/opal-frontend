<opal-lib-govuk-error-summary
  [errors]="formErrorSummaryMessage"
  (errorClick)="scrollTo($event)"
></opal-lib-govuk-error-summary>
<form [formGroup]="form" (submit)="handleFormSubmit($event)" novalidate>
  <opal-lib-govuk-radio
    fieldSetId="payerType"
    legendText="Payer type"
    legendClasses="govuk-fieldset__legend--s"
    [errors]="formControlErrorMessages['payerType']"
  >
    <div
      opal-lib-govuk-radios-item
      labelText="Individual"
      inputId="payer-individual"
      inputName="payerType"
      inputValue="individual"
      [ariaControls]="'individual-payer-conditional'"
      [control]="form.controls['payerType']"
    ></div>
    <opal-lib-govuk-radios-conditional conditionalId="individual-payer-conditional">
      @if (form.controls['payerType'].value === 'individual') {
        <opal-lib-govuk-select
          labelText="Title"
          labelClasses="govuk-label--s"
          selectId="title"
          selectName="title"
          [options]="titleOptions"
          [control]="form.controls['title']"
          [errors]="formControlErrorMessages['title']"
        ></opal-lib-govuk-select>
        <opal-lib-govuk-text-input
          labelText="First names"
          inputId="firstNames"
          inputName="firstNames"
          inputClasses="govuk-input--width-20"
          labelClasses="govuk-label--s"
          hintText="Include their middle names"
          [control]="form.controls['firstNames']"
          [errors]="formControlErrorMessages['firstNames']"
        ></opal-lib-govuk-text-input>
        <opal-lib-govuk-text-input
          labelText="Last name"
          inputId="lastName"
          inputName="lastName"
          inputClasses="govuk-input--width-20"
          labelClasses="govuk-label--s"
          [control]="form.controls['lastName']"
          [errors]="formControlErrorMessages['lastName']"
        ></opal-lib-govuk-text-input>
      }
    </opal-lib-govuk-radios-conditional>
    <div
      opal-lib-govuk-radios-item
      labelText="Company"
      inputId="payer-company"
      inputName="payerType"
      inputValue="company"
      [ariaControls]="'company-payer-conditional'"
      [control]="form.controls['payerType']"
    ></div>
    <opal-lib-govuk-radios-conditional conditionalId="company-payer-conditional">
      @if (form.controls['payerType'].value === 'company') {
        <opal-lib-govuk-text-input
          labelText="Company name"
          inputId="companyName"
          inputName="companyName"
          inputClasses="govuk-input--width-20"
          labelClasses="govuk-label--s"
          [control]="form.controls['companyName']"
          [errors]="formControlErrorMessages['companyName']"
        ></opal-lib-govuk-text-input>
      }
    </opal-lib-govuk-radios-conditional>
  </opal-lib-govuk-radio>

  <h2 class="govuk-heading-m">Address</h2>
  <opal-lib-govuk-text-input
    labelText="Address line 1"
    inputId="addressLine1"
    inputName="addressLine1"
    [control]="form.controls['addressLine1']"
    [errors]="formControlErrorMessages['addressLine1']"
  ></opal-lib-govuk-text-input>
  <opal-lib-govuk-text-input
    labelText="Address line 2"
    inputId="addressLine2"
    inputName="addressLine2"
    [control]="form.controls['addressLine2']"
    [errors]="formControlErrorMessages['addressLine2']"
  ></opal-lib-govuk-text-input>
  <opal-lib-govuk-text-input
    labelText="Address line 3"
    inputId="addressLine3"
    inputName="addressLine3"
    inputClasses="govuk-input--width-20"
    [control]="form.controls['addressLine3']"
    [errors]="formControlErrorMessages['addressLine3']"
  ></opal-lib-govuk-text-input>
  <opal-lib-govuk-text-input
    labelText="Post code"
    inputId="postcode"
    inputName="postcode"
    inputClasses="govuk-input--width-10"
    [control]="form.controls['postcode']"
    [errors]="formControlErrorMessages['postcode']"
  ></opal-lib-govuk-text-input>

  <div class="govuk-button-group">
    <button class="govuk-button" id="submitForm" type="submit">Continue</button>
    <opal-lib-govuk-cancel-link (linkClickEvent)="cancelRequested.emit()"></opal-lib-govuk-cancel-link>
  </div>
</form>
