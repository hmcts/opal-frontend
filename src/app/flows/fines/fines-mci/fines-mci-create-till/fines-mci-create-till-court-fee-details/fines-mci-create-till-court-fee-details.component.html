<div class="govuk-grid-column-two-thirds" id="fines-mci-create-till-court-fee-details">
  <span class="govuk-caption-l">{{ finesMciStore.businessUnit()?.business_unit_name }}</span>
  <h1 class="govuk-heading-l">Court fee</h1>

  @if (feeLoadFailed()) {
    <p class="govuk-error-message" role="alert">Court fees could not be loaded. Try again later.</p>
    <opal-lib-govuk-cancel-link (linkClickEvent)="handleCancel()"></opal-lib-govuk-cancel-link>
  } @else if (isContinuing()) {
    <output class="govuk-body govuk-!-display-block">Loading next screen</output>
    <opal-lib-govuk-cancel-link (linkClickEvent)="handleCancel()"></opal-lib-govuk-cancel-link>
  } @else if (courtFeeItems().length === 0) {
    <output class="govuk-body govuk-!-display-block">No court fees are available for this business unit.</output>
    <opal-lib-govuk-cancel-link (linkClickEvent)="handleCancel()"></opal-lib-govuk-cancel-link>
  } @else {
    <app-fines-mci-create-till-court-fee-details-form
      [courtFeeItems]="courtFeeItems()"
      [initialDraft]="finesMciStore.courtFeeDraft()"
      (formSubmit)="handleSubmit($event)"
      (unsavedChanges)="handleUnsavedChanges($event)"
      (cancelRequested)="handleCancel()"
    ></app-fines-mci-create-till-court-fee-details-form>
  }
</div>
