<opal-lib-govuk-error-summary
  [errors]="formErrorSummaryMessage"
  (errorClick)="scrollTo($event)"
></opal-lib-govuk-error-summary>

<form (submit)="handleFormSubmit($event)" [formGroup]="form" novalidate>
  <opal-lib-govuk-radio
    fieldSetId="payment-received-from"
    legendText="Payment received from"
    legendClasses="govuk-fieldset__legend--s"
    [errors]="formControlErrorMessages['paymentReceivedFrom']"
  >
    <div
      opal-lib-govuk-radios-item
      labelText="Applicant"
      inputId="paymentReceivedFrom"
      inputName="paymentReceivedFrom"
      inputValue="applicant"
      [control]="form.controls['paymentReceivedFrom']"
    ></div>
    <div
      opal-lib-govuk-radios-item
      labelText="Third party"
      inputId="paymentReceivedFrom-third-party"
      inputName="paymentReceivedFrom"
      inputValue="thirdParty"
      [control]="form.controls['paymentReceivedFrom']"
    ></div>
  </opal-lib-govuk-radio>

  <button class="govuk-button" id="submitForm" type="submit">Continue</button>
</form>
