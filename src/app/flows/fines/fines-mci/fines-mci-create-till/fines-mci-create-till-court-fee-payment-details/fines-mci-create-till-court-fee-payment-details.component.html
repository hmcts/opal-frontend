<div class="govuk-grid-column-full govuk-!-margin-bottom-4" [hidden]="isNavigating()">
  <opal-lib-govuk-back-link (clickEvent)="handleBack()"></opal-lib-govuk-back-link>
</div>

<div class="govuk-grid-column-two-thirds" id="fines-mci-create-till-court-fee-payment-details">
  <span class="govuk-caption-l">{{ finesMciStore.businessUnit()?.business_unit_name }}</span>
  <h1 #paymentHeading class="govuk-heading-l" tabindex="-1">Payment details</h1>
  @if (isNavigating()) {
    <output class="govuk-body govuk-!-display-block">Loading next screen</output>
  }
  <div [hidden]="isNavigating()">
    @if (paymentMappings(); as mappings) {
      <app-fines-mci-create-till-court-fee-payment-details-form
        [paymentMethods]="mappings.methods"
        [paymentSources]="mappings.sources"
        [initialValue]="finesMciStore.courtFeePaymentDetails()"
        (unsavedChanges)="handleUnsavedChanges($event)"
        (formSubmit)="handleSubmit($event)"
        (cancelRequested)="handleCancel()"
      ></app-fines-mci-create-till-court-fee-payment-details-form>
    } @else {
      @if (isRetrying()) {
        <output class="govuk-body govuk-!-display-block">Loading payment options</output>
      } @else {
        <p class="govuk-error-message" role="alert">Payment options could not be loaded. Try again.</p>
        <div class="govuk-button-group">
          <opal-lib-govuk-button
            buttonId="retry-payment-options"
            buttonClasses="govuk-!-display-block"
            (buttonClickEvent)="handleRetry()"
            >Try again</opal-lib-govuk-button
          >
          <opal-lib-govuk-cancel-link (linkClickEvent)="handleCancel()"></opal-lib-govuk-cancel-link>
        </div>
      }
    }
  </div>
</div>
