<opal-lib-govuk-error-summary
  [errors]="formErrorSummaryMessage"
  (errorClick)="scrollTo($event)"
></opal-lib-govuk-error-summary>
<form [formGroup]="form" (submit)="handleFormSubmit($event)" novalidate>
  <h2 class="govuk-heading-m">Amount</h2>
  <opal-lib-govuk-text-input-prefix-suffix
    labelText="Amount"
    labelClasses="govuk-visually-hidden"
    inputId="amount"
    inputName="amount"
    inputClasses="govuk-input--width-5"
    prefixText="£"
    [control]="form.controls['amount']"
    [errors]="formControlErrorMessages['amount']"
  ></opal-lib-govuk-text-input-prefix-suffix>
  <opal-lib-govuk-radio
    fieldSetId="payerType"
    legendText="Payment received from"
    legendClasses="govuk-fieldset__legend--s"
    [errors]="formControlErrorMessages['payerType']"
  >
    <div
      opal-lib-govuk-radios-item
      labelText="Defendant"
      inputId="suspense-payer-defendant"
      inputName="payerType"
      inputValue="defendant"
      [control]="form.controls['payerType']"
    ></div>
    <div
      opal-lib-govuk-radios-item
      labelText="3rd party"
      inputId="suspense-payer-third-party"
      inputName="payerType"
      inputValue="thirdParty"
      [control]="form.controls['payerType']"
    ></div>
  </opal-lib-govuk-radio>
  <opal-lib-govuk-radio
    fieldSetId="methodOfPayment"
    legendText="Method of payment"
    legendClasses="govuk-fieldset__legend--s"
    [errors]="formControlErrorMessages['methodOfPayment']"
  >
    <div
      opal-lib-govuk-radios-item
      labelText="Notes and coins"
      inputId="suspense-method-notes-coins"
      inputName="methodOfPayment"
      inputValue="notesCoins"
      [control]="form.controls['methodOfPayment']"
    ></div>
    <div
      opal-lib-govuk-radios-item
      labelText="Postal order"
      inputId="suspense-method-postal-order"
      inputName="methodOfPayment"
      inputValue="postalOrder"
      [ariaControls]="'postal-order-reference-conditional'"
      [control]="form.controls['methodOfPayment']"
    ></div>
    <opal-lib-govuk-radios-conditional conditionalId="postal-order-reference-conditional">
      <opal-lib-govuk-text-input
        labelText="Payment reference"
        labelClasses="govuk-label--s"
        inputId="paymentReferencePostalOrder"
        inputName="paymentReferencePostalOrder"
        [control]="form.controls['paymentReferencePostalOrder']"
        [errors]="formControlErrorMessages['paymentReferencePostalOrder']"
      ></opal-lib-govuk-text-input>
    </opal-lib-govuk-radios-conditional>
    <div
      opal-lib-govuk-radios-item
      labelText="Cheque"
      inputId="suspense-method-cheque"
      inputName="methodOfPayment"
      inputValue="cheque"
      [ariaControls]="'cheque-reference-conditional'"
      [control]="form.controls['methodOfPayment']"
    ></div>
    <opal-lib-govuk-radios-conditional conditionalId="cheque-reference-conditional">
      <opal-lib-govuk-text-input
        labelText="Payment reference"
        labelClasses="govuk-label--s"
        inputId="paymentReferenceCheque"
        inputName="paymentReferenceCheque"
        [control]="form.controls['paymentReferenceCheque']"
        [errors]="formControlErrorMessages['paymentReferenceCheque']"
      ></opal-lib-govuk-text-input>
    </opal-lib-govuk-radios-conditional>
    <div
      opal-lib-govuk-radios-item
      labelText="Credit transfer"
      inputId="suspense-method-credit-transfer"
      inputName="methodOfPayment"
      inputValue="creditTransfer"
      [ariaControls]="'credit-transfer-details-conditional'"
      [control]="form.controls['methodOfPayment']"
    ></div>
    <opal-lib-govuk-radios-conditional conditionalId="credit-transfer-details-conditional">
      <opal-lib-govuk-radio
        fieldSetId="source"
        legendText="Source"
        legendClasses="govuk-fieldset__legend--s"
        [errors]="formControlErrorMessages['source']"
      >
        <div
          opal-lib-govuk-radios-item
          labelText="allpay"
          inputId="source-allpay"
          inputName="source"
          inputValue="allpay"
          [control]="form.controls['source']"
        ></div>
        <div
          opal-lib-govuk-radios-item
          labelText="Barclaycard"
          inputId="source-barclaycard"
          inputName="source"
          inputValue="Barclaycard"
          [control]="form.controls['source']"
        ></div>
        <div
          opal-lib-govuk-radios-item
          labelText="British Telecom"
          inputId="source-british-telecom"
          inputName="source"
          inputValue="British Telecom"
          [control]="form.controls['source']"
        ></div>
        <div
          opal-lib-govuk-radios-item
          labelText="DWP/AEA"
          inputId="source-dwp-aea"
          inputName="source"
          inputValue="DWP/AEA"
          [control]="form.controls['source']"
        ></div>
        <div
          opal-lib-govuk-radios-item
          labelText="NatWest"
          inputId="source-natwest"
          inputName="source"
          inputValue="NatWest"
          [control]="form.controls['source']"
        ></div>
        <div
          opal-lib-govuk-radios-item
          labelText="Other"
          inputId="source-other"
          inputName="source"
          inputValue="Other"
          [control]="form.controls['source']"
        ></div>
      </opal-lib-govuk-radio>
      <opal-lib-govuk-text-input
        labelText="Payment reference"
        labelClasses="govuk-label--s"
        inputId="paymentReferenceCreditTransfer"
        inputName="paymentReferenceCreditTransfer"
        [control]="form.controls['paymentReferenceCreditTransfer']"
        [errors]="formControlErrorMessages['paymentReferenceCreditTransfer']"
      ></opal-lib-govuk-text-input>
    </opal-lib-govuk-radios-conditional>
  </opal-lib-govuk-radio>
  <opal-lib-govuk-radio
    fieldSetId="reason"
    legendText="Suspense reason"
    legendClasses="govuk-fieldset__legend--s"
    [errors]="formControlErrorMessages['reason']"
  >
    <div
      opal-lib-govuk-radios-item
      labelText="Fines overpayment (OF)"
      inputId="suspense-reason-overpayment"
      inputName="reason"
      inputValue="overpayment"
      [control]="form.controls['reason']"
    ></div>
    <div
      opal-lib-govuk-radios-item
      labelText="Fine paid in advance (FA)"
      inputId="suspense-reason-advance"
      inputName="reason"
      inputValue="advance"
      [control]="form.controls['reason']"
    ></div>
    <div
      opal-lib-govuk-radios-item
      labelText="Miscellaneous payment (MS)"
      inputId="suspense-reason-miscellaneous"
      inputName="reason"
      inputValue="miscellaneous"
      [control]="form.controls['reason']"
    ></div>
    <div
      opal-lib-govuk-radios-item
      labelText="Unidentified amount (UN)"
      inputId="suspense-reason-unidentified"
      inputName="reason"
      inputValue="unidentified"
      [ariaControls]="'unidentified-details-conditional'"
      [control]="form.controls['reason']"
    ></div>
    <opal-lib-govuk-radios-conditional conditionalId="unidentified-details-conditional">
      <<<<<<< HEAD
      <opal-lib-govuk-text-input
        labelText="Add relevant details"
        labelClasses="govuk-label--s"
        inputId="relevantDetails"
        inputName="relevantDetails"
        [control]="form.controls['relevantDetails']"
        [errors]="formControlErrorMessages['relevantDetails']"
      ></opal-lib-govuk-text-input>
      =======
      <div
        class="govuk-form-group"
        [class.govuk-form-group--error]="formSubmitted && formControlErrorMessages['relevantDetails']"
      >
        <label class="govuk-label govuk-heading-s govuk-!-font-weight-bold" for="relevantDetails"
          >Add relevant details</label
        >
        @if (formSubmitted && formControlErrorMessages['relevantDetails']; as message) {
          <p class="govuk-error-message" id="relevantDetails-error">{{ message }}</p>
        }
        <input
          class="govuk-input"
          id="relevantDetails"
          maxlength="50"

            formSubmitted && formControlErrorMessages['relevantDetails'] ? 'relevantDetails-error' : null
          "
        />
      </div>
      >>>>>>> master
    </opal-lib-govuk-radios-conditional>
  </opal-lib-govuk-radio>
  <div class="govuk-button-group">
    <button class="govuk-button" id="submitForm" type="submit">Continue</button
    ><opal-lib-govuk-cancel-link (linkClickEvent)="cancelRequested.emit()"></opal-lib-govuk-cancel-link>
  </div>
</form>
