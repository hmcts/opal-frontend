<div class="govuk-grid-column-full govuk-!-margin-bottom-4" [hidden]="isNavigating()">
  <opal-lib-govuk-back-link (clickEvent)="handleBack()"></opal-lib-govuk-back-link>
</div>
<div class="govuk-grid-column-two-thirds">
  <span class="govuk-caption-l">{{ finesMciStore.businessUnit()?.business_unit_name }}</span>
  <h1 class="govuk-heading-l">Check payment</h1>
  @if (isNavigating()) {
    <output class="govuk-body govuk-!-display-block">Loading payment details</output>
  } @else if (summaryRows(); as rows) {
    <app-fines-mci-create-till-payment-summary
      title="Court fee payment"
      summaryId="fines-mci-court-fee-payment-summary"
      [rows]="rows"
    ></app-fines-mci-create-till-payment-summary>
  } @else {
    <p class="govuk-error-message" role="alert">
      Court fee payment details could not be loaded. Go back and try again.
    </p>
  }
</div>
