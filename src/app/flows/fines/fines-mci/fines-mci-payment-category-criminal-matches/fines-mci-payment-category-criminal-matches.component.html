<opal-lib-govuk-back-link (clickEvent)="navigateBack()"></opal-lib-govuk-back-link>

@if (isMatchesResults()) {
  <span class="govuk-caption-m">Avon and Somerset</span>
  <h1 class="govuk-heading-l">Search results</h1>

  <h2 class="govuk-heading-m">Select 1 account to continue</h2>

  <app-fines-mci-payment-category-criminal-matches-table-wrapper
    [tableData]="tableData()"
    [existingSortState]="sortState"
    [selectedAccountId]="selectedAccountId()"
    (accountSelected)="selectAccount($event)"
  ></app-fines-mci-payment-category-criminal-matches-table-wrapper>

  <div class="govuk-button-group govuk-!-margin-top-6">
    <button class="govuk-button" type="button">Continue</button>
    <a class="govuk-link govuk-link--no-visited-state" [routerLink]="criminalSearchRoute">Search again</a>
  </div>

  <p class="govuk-body">
    <a class="govuk-link govuk-link--no-visited-state" [routerLink]="financeDashboardRoute">Cancel</a>
  </p>
} @else {
  <div class="govuk-grid-column-two-thirds">
    <span class="govuk-caption-m">Avon and Somerset</span>
    <h1 class="govuk-heading-l">{{ content().heading }}</h1>
    <p class="govuk-body">{{ content().body }}</p>
    <p class="govuk-body">Placeholder for {{ content().ticket }}.</p>
  </div>
}
