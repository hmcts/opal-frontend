<div class="govuk-form-group" [formGroup]="form">

    <legend class="govuk-fieldset__legend govuk-visually-hidden">Select business units</legend>
    <app-fines-fpu-to-publish-table-wrapper
      [businessUnits]="businessUnits"

  </fieldset>
</div>
