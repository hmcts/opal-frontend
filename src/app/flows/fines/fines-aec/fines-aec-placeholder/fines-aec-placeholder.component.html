@if (isTab) {
  <h2 class="govuk-heading-m" id="aec-tab-placeholder-heading">{{ heading }}</h2>
  <p class="govuk-body">This page is not yet available.</p>
} @else {
  <div class="govuk-grid-column-full">
    <a
      class="govuk-back-link"
      id="aec-placeholder-back"
      [routerLink]="['..', routingPaths.children.config]"
      [fragment]="store.activeTab()"
      >Back</a
    >
    <h1 class="govuk-heading-l" id="aec-placeholder-heading">{{ heading }}</h1>
    <p class="govuk-body">This page is not yet available.</p>
  </div>
}
