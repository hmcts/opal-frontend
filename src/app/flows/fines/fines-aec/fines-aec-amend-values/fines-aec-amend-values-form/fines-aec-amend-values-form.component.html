<div class="govuk-grid-column-two-thirds">
  <opal-lib-govuk-error-summary [errors]="formErrorSummaryMessage" (errorClick)="scrollTo($event)" />
  <opal-lib-govuk-heading-with-caption
    captionText="Account types"
    [headingText]="accountTypeName"
    headingClasses="govuk-heading-l"
  />
  <form
    id="aec-amend-values-form"
    autocomplete="off"
    [formGroup]="form"
    (submit)="handleFormSubmit($event)"
    [attr.aria-busy]="pending"
  >
    <fieldset class="govuk-fieldset" [disabled]="pending">
      <opal-lib-govuk-text-input-prefix-suffix
        labelText="Minimum enforcement value"
        inputId="minimum_balance"
        inputName="minimum_balance"
        inputClasses="govuk-input--width-10"
        prefixText="£"
        [control]="form.controls.minimum_balance"
        [errors]="formControlErrorMessages['minimum_balance']"
      />
      <opal-lib-govuk-text-input-prefix-suffix
        labelText="High value (optional)"
        inputId="high_value"
        inputName="high_value"
        inputClasses="govuk-input--width-10"
        prefixText="£"
        [control]="form.controls.high_value"
        [errors]="formControlErrorMessages['high_value']"
      />
    </fieldset>
    <hr class="govuk-section-break govuk-section-break--l govuk-section-break--visible" />
    <div class="govuk-button-group">
      <button opalLibGovukButton buttonId="aec-amend-save" type="submit" [disabled]="pending">Save</button>
      <opal-lib-govuk-cancel-link (linkClickEvent)="cancelRequested.emit()" />
    </div>
  </form>
</div>
